<script type="module">
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='Acasă',subject='Chimie',docs=[],cards=[],attempts=[],plans=[],exam=null,searchResults=[],query='',searchScope='all',flip=false,cardIndex=0,semantic=null,embedder=null;const tabs=['Acasă','Capitole','Teste grilă','Bibliotecă','Căutare','Flashcards','Exerciții','Examene','Plan','Progres','Modele 3D','Sincronizare','Setări'];const dbReq=indexedDB.open('biochem-free-v1',2);let db;let chapterRows=[],quizzes=[],quizAttempts=[],review=[],models=[],cloud=null,cloudUser=null,cloudClient=null,syncing=false,modelUrl=null;dbReq.onupgradeneeded=e=>{const d=e.target.result;for(const n of ['docs','cards','attempts','plans','review','models','assets','filemeta','chapters','quizzes','quizAttempts'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};const ready=new Promise((ok,no)=>{dbReq.onsuccess=()=>{db=dbReq.result;ok()};dbReq.onerror=()=>no(dbReq.error)});const uid=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random();function store(n,mode='readonly'){return db.transaction(n,mode).objectStore(n)}function all(n){return new Promise((r,j)=>{let q=store(n).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}function put(n,v){return new Promise((r,j)=>{let q=store(n,'readwrite').put(v);q.onsuccess=r;q.onerror=()=>j(q.error)})}function del(n,id){return new Promise((r,j)=>{let q=store(n,'readwrite').delete(id);q.onsuccess=r;q.onerror=()=>j(q.error)})}async function reload(){[docs,cards,attempts,plans,review,models,chapterRows,quizzes,quizAttempts]=await Promise.all(['docs','cards','attempts','plans','review','models','chapters','quizzes','quizAttempts'].map(all));render();hydrateOriginals()}function msg(t){$('#status').textContent=t}function btn(t,fn,cl='secondary'){return `<button class="${cl}" data-act="${fn}">${t}</button>`}function changeTab(t){tab=t;render()}function top(){return `<div class="row"><label style="margin:0">Materia:</label><select id="subject" style="width:auto;margin:0"><option ${subject==='Chimie'?'selected':''}>Chimie</option><option ${subject==='Biologie'?'selected':''}>Biologie</option></select></div>`}function filtered(){return docs.filter(d=>d.subject===subject)}function docType(d){if(['notebook','book','test'].includes(d.kind))return d.kind;let t=(d.title||'').toLowerCase();return /test|gril|exerc|quiz|evaluare/.test(t)?'test':/manual|carte|textbook|book/.test(t)?'book':'notebook'}const typeLabels={notebook:'Caiet',book:'Carte / manual',test:'Test / exerciții'};function render(){let n=$('#nav');n.innerHTML=tabs.map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t}</button>`).join('');let a=$('#app');a.innerHTML=top()+( { 'Acasă':home,'Capitole':chaptersView,'Teste grilă':quizView,'Bibliotecă':library,'Căutare':search,'Flashcards':flashcards,'Exerciții':practice,'Examene':exams,'Plan':plan,'Progres':progress,'Setări':settings,'Modele 3D':modelsView,'Revizuire OCR':reviewView,'Sincronizare':syncView}[tab])();$('#subject').onchange=e=>{subject=e.target.value;searchResults=[];render()};n.querySelectorAll('button').forEach(b=>b.onclick=()=>changeTab(b.dataset.tab));a.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>actions[b.dataset.act]?.(b));}

const normalize=s=>s.toLocaleLowerCase('ro').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ăâîșț ]/g,' ');const stop=new Set('si sau este sunt care pentru intr un una din la de pe cu ca ce cum despre atunci acest aceasta acestui prin mai doar se sa in ale al ai a o i lui lor fie daca nu'.split(' '));function tokens(s){return normalize(s).split(/\s+/).filter(w=>w.length>2&&!stop.has(w))}function chunks(d){let result=[];for(let p of (d.pages||[{number:1,text:d.text}])){let s=p.text||'';let parts=s.match(/[\s\S]{1,850}/g)||[];for(let i=0;i<parts.length;i++)result.push({docId:d.id,title:d.title,subject:d.subject,page:p.number,text:parts[i],key:d.id+':'+p.number+':'+i})}return result}function lexical(q,t){let qt=tokens(q),tt=tokens(t);if(!qt.length)return 0;let ts=new Set(tt);let overlap=qt.reduce((s,w)=>s+(ts.has(w)?1:tt.some(x=>x.startsWith(w)||w.startsWith(x))?.5:0),0);return overlap/Math.sqrt(qt.length)}async function getEmbedder(){if(embedder)return embedder;msg('Se descarcă modelul semantic gratuit (prima dată poate dura)...');const m=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');embedder=await m.pipeline('feature-extraction','Xenova/paraphrase-multilingual-MiniLM-L12-v2',{dtype:'q8'});return embedder}async function vector(s){let f=await getEmbedder();let v=await f(s,{pooling:'mean',normalize:true});return Array.from(v.data)}function dot(a,b){return a.reduce((s,x,i)=>s+x*b[i],0)}function search(){return `<h2>Caută în notițele tale</h2><section class="panel"><label>Ce nu înțelegi?</label><textarea id="q" placeholder="Ex.: De ce benzenul reacționează prin substituție?">${esc(query)}</textarea><label>Caută în</label><select id="searchScope"><option value="all" ${searchScope==='all'?'selected':''}>Toate materialele</option><option value="notebook" ${searchScope==='notebook'?'selected':''}>Caiete</option><option value="book" ${searchScope==='book'?'selected':''}>Cărți / manuale</option><option value="test" ${searchScope==='test'?'selected':''}>Teste / exerciții</option></select><div class="row">${btn('Căutare semantică','semantic','primary')} ${btn('Căutare rapidă','quick')}</div><p class="muted">Căutarea semantică găsește idei asemănătoare, nu doar cuvinte identice. Modelul rulează local, dacă browserul îl suportă.</p></section><section class="panel"><h3>Rezultate ${searchResults.length?'('+searchResults.length+')':''}</h3>${searchResults.length?searchResults.map((r,i)=>`<div class="result"><b>${esc(r.title)}</b> <span class="tag">${typeLabels[r.kind||'notebook']}</span> <span class="tag">Pagina ${r.page}</span> <span class="tag">${r.score.toFixed(2)}</span><p>${esc(r.text)}</p>${btn('Creează flashcard din pasaj','makeCard:'+i)}</div>`).join(''):'<p class="muted">Rezultatele relevante apar aici, cu sursa și numărul paginii.</p>'}</section>`}
function flashcards(){let cc=cards.filter(c=>c.subject===subject),c=cc[cardIndex%Math.max(cc.length,1)];return `<h2>Flashcards</h2><section class="panel"><label>Întrebare</label><textarea id="front" placeholder="Ce este...?"></textarea><label>Răspuns</label><textarea id="back" placeholder="Definiție / explicație..."></textarea>${btn('Adaugă card','addCard','primary')}</section><section class="panel"><h3>Repetiție (${cc.length} carduri)</h3>${c?`<div class="card">${esc(flip?c.back:c.front)}</div><p class="muted" style="text-align:center">Card ${cardIndex%cc.length+1} / ${cc.length}</p><div class="row">${btn('Întoarce','flip','primary')} ${btn('Știu ✓','know')} ${btn('Repetă ×','miss')} ${btn('Următorul →','next')}</div><p class="muted">Repetiții corecte: ${c.good||0}; de revizuit: ${c.missed||0}</p>`:'<p>Adaugă primul flashcard sau creează unul dintr-un rezultat de căutare.</p>'}</section>`}

const actions={goLibrary:()=>changeTab('Bibliotecă'),goSearch:()=>changeTab('Căutare'),saveNote:async()=>{let text=$('#note').value.trim(),title=$('#title').value.trim()||'Notițe';if(!text)return msg('Introdu textul notițelor.');await put('docs',{id:uid(),subject,title,kind:$('#importKind').value,text,pages:[{number:1,text}]});msg('Notițe salvate.');reload()},upload:async()=>{let files=[...$('#files').files];if(!files.length)return msg('Alege fișierele.');for(let f of files){try{msg('Procesez: '+f.name);let pages=[];if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';let pdf=await pdfjs.getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i),content=await page.getTextContent(),text=content.items.map(x=>x.str).join(' ');if(text.trim().length<30){msg(`PDF scanat: OCR pagina ${i}/${pdf.numPages}`);let vp=page.getViewport({scale:1.7}),canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;text=await ocr(canvas)}pages.push({number:i,text})}}else if(f.type.startsWith('image/')){let img=await createImageBitmap(f),canvas=document.createElement('canvas'),scale=Math.min(1.8,2300/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);pages=[{number:1,text:await ocr(canvas),original:canvas.toDataURL('image/jpeg',.72)}]}else{pages=[{number:1,text:await f.text()}]}let text=pages.map(p=>p.text).join('\n');if(!text.trim())msg('Nu am putut extrage text din '+f.name);let rid=uid();await saveAsset(rid,f,'document',f.name);for(let i=0;i<pages.length;i++){if(pages[i].original){let raw=await fetch(pages[i].original).then(r=>r.blob());let aid=rid+'-page-'+i;await saveAsset(aid,raw,'page',f.name+' page '+(i+1));pages[i].assetId=aid;delete pages[i].original}}await put('review',{id:rid,subject,title:f.name,kind:$('#importKind').value,sourceAssetId:rid,pages:pages.map(p=>({...p,approved:false})),created:Date.now(),updated:Date.now()})}catch(e){msg('Eroare la '+f.name+': '+e.message);alert('Nu am putut procesa '+f.name+'\n'+e.message)}}await reload();msg('Import finalizat. Deschide Revizuire OCR pentru a aproba paginile înainte de indexare.')},quick:()=>runSearch(false),semantic:()=>runSearch(true),addCard:async()=>{let front=$('#front').value.trim(),back=$('#back').value.trim();if(!front||!back)return msg('Completează ambele câmpuri.');await put('cards',{id:uid(),subject,front,back,good:0,missed:0});cardIndex=0;flip=false;reload()},flip:()=>{flip=!flip;render()},next:()=>{cardIndex++;flip=false;render()},know:()=>rate(true),miss:()=>rate(false),showAnswer:()=>$('#reference').classList.remove('hidden'),markYes:()=>mark(true),markNo:()=>mark(false),startExam:()=>{let pool=cards.filter(c=>c.subject===subject).sort(()=>Math.random()-.5);if(!pool.length)return msg('Creează flashcarduri înainte de examen.');exam={subject,questions:pool.slice(0,10)};render()},gradeExam:()=>{let box=$('#examKey');box.innerHTML='<h3>Barem de autocorectare</h3>'+exam.questions.map((c,i)=>`<div class="result"><b>${i+1}. ${esc(c.front)}</b><p>${esc(c.back)}</p><label><input type="checkbox" data-grade="${i}"> Răspuns corect</label></div>`).join('')+btn('Salvează rezultatul','saveExam','primary');box.querySelector('[data-act]').onclick=actions.saveExam},saveExam:async()=>{for(let [i,c] of exam.questions.entries()){await put('attempts',{id:uid(),subject,question:c.front,ok:!!$(`[data-grade="${i}"]`)?.checked,date:Date.now()})}exam=null;msg('Rezultatul examenului a fost salvat.');reload()},addPlan:async()=>{let goal=$('#goal').value.trim();if(!goal)return;await put('plans',{id:uid() function parseQuiz(raw){raw=raw.trim();if(!raw)throw Error('Nu ai introdus întrebări.');if(raw.startsWith('[')||raw.startsWith('{')){let arr=JSON.parse(raw);if(!Array.isArray(arr))arr=arr.questions;return arr.map(x=>({question:x.question,options:x.options,answer:Array.isArray(x.answer)?x.answer:[x.answer]})).filter(x=>x.question&&x.options?.length>=2&&x.answer.length)}let result=[],current=null;function flush(){if(current?.question&&current.options.length>=2&&current.answer?.length)result.push(current)}for(let line of raw.split(/\r?\n/)){line=line.trim();if(!line)continue;let q=line.match(/^(?:\d+[.)]\s*|Q\s*:\s*)(.+)$/i),o=line.match(/^([A-F])[).:]\s*(.+)$/i),a=line.match(/^(?:R|Răspuns|Raspuns|Answer|Corect)\s*:\s*([A-F](?:\s*[,;+]\s*[A-F])*)\s*$/i);if(q){flush();current={question:q[1],options:[],answer:[]}}else if(o&&current){current.options.push(o[2])}else if(a&&current){current.answer=[...new Set(a[1].match(/[A-F]/gi).map(x=>x.toUpperCase().charCodeAt(0)-65))]}else if(current&&!current.options.length){current.question+=' '+line}}flush();return result.filter(x=>x.answer.every(i=>i>=0&&i<x.options.length))}

const pauseImport=()=>new Promise(r=>setTimeout(r,0));

async function pdfPages(file,onPage){
const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');
pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';
const task=pdfjs.getDocument({data:await file.arrayBuffer()});let pdf,worker=null;
try{
 pdf=await task.promise;
 for(let i=1;i<=pdf.numPages;i++){
  let page=await pdf.getPage(i),content=await page.getTextContent();
  // Reconstituieste liniile pentru intrebari si raspunsuri, nu lipeste totul intr-un singur rand.
  let lines=[],line='',lastY=null;
  for(const item of content.items){if(typeof item.str!=='string')continue;
   const y=item.transform?.[5];if(lastY!==null&&typeof y==='number'&&Math.abs(y-lastY)>3){if(line.trim())lines.push(line.trim());line=''}
   line+=(line?' ':'')+item.str;if(item.hasEOL){lines.push(line.trim());line='';lastY=null}else if(typeof y==='number')lastY=y;
  }
  if(line.trim())lines.push(line.trim());let text=lines.join('\n');
  if(text.trim().length<30){
   msg(`OCR automat: pagina ${i}/${pdf.numPages} — ${file.name}`);
   if(!window.Tesseract){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.append(s)})}
   if(!worker)worker=await Tesseract.createWorker('ron+eng');
   const vp=page.getViewport({scale:1.25});const canvas=document.createElement('canvas');
   canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
   try{await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;text=(await worker.recognize(canvas)).data.text||''}
   finally{canvas.width=0;canvas.height=0}
  }
  await onPage({number:i,text},pdf.numPages);
  page.cleanup();if(i%3===0)await pauseImport();
 }
}finally{if(worker)await worker.terminate();if(pdf)await pdf.destroy();else await task.destroy().catch(()=>{})}
}

const originalParseQuiz=parseQuiz;
parseQuiz=function(raw){
try{const parsed=originalParseQuiz(raw);if(parsed.length)return parsed}catch(e){if(raw.trim().startsWith('[')||raw.trim().startsWith('{'))throw e}

function scoreChapters(text,sub){const t=normalize(text||'');return Object.entries(chapterCatalog[sub]||{}).map(([name,terms])=>({name,score:terms.reduce((s,term)=>{const needle=normalize(term);return s+(t.includes(needle)?(needle.includes(' ')?3:1):0)},0)})).sort((a,b)=>b.score-a.score)}

function parseQuizBetter(raw){const out=[];let cur=null,lastOpt=-1;function finish(){if(cur?.question&&cur.options.length>=2){cur.answer=cur.answer.filter(i=>i<cur.options.length);cur.chapter=chapterOf(cur.question+' '+cur.options.join(' '),subject);cur.type=isProblem(cur)?'problem':'theory';out.push(cur)}cur=null;lastOpt=-1}

// Avoid crashing when a prior upload view has been re-rendered while async PDF processing finishes.
const previousHandleQuiz2=handleQuiz;
handleQuiz=async function(action,b){if(action==='import'){const titleEl=$('#quiztitle'),chapterEl=$('#quizchapter'),fileEl=$('#quizfile'),textEl=$('#quiztext');if(!titleEl||!fileEl)return msg('Formularul s-a schimbat. Revino la Teste grilă și încearcă din nou.');const title=titleEl.value.trim()||fileEl.files[0]?.name||'Test grilă';const sub=subject;try{let raw=textEl?.value||'',file=fileEl.files[0];if(file){if(/\.pdf$/i.test(file.name)||file.type==='application/pdf'){const pages=[];await pdfPages(file,async(p,total)=>{pages.push(p.text);msg(`Citesc grilele ${p.number}/${total}`)});raw=pages.join('\n')}else raw=await file.text()}const questions=parseQuiz(raw);if(!questions.length)throw Error('Nu am identificat grile complete; verifică dacă PDF-ul este scanat sau are variantele pe coloane.');const chapter=chapterEl?.value?.trim()||'Mai multe capitole';await put('quizzes',{id:uid(),subject:sub,title,chapter,questions,created:Date.now()});await reload();msg(`Salvate ${questions.length} grile. Le poți edita ulterior.`)}catch(e){msg('Import test: '+e.message)}return}return previousHandleQuiz2(action,b)};
// Classify previously imported questions too, without altering their saved content.
function quizQuestionChapter(it,q){return it.chapter||chapterOf(it.question+' '+it.options.join(' '),q.subject)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-topic-search],[data-practice-generate]');if(!b)return;if(b.dataset.topicSearch){const input=$('#topicSearch');if(!input)return;const term=input.value.trim();if(!term)return msg('Scrie un subiect.');query=term;searchResults=allSegments().map(s=>({...s,score:lexical(term,s.text)+((normalize(s.text).includes(normalize(term)))?1:0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,100);tab='Căutare';render();msg(`${searchResults.length} pasaje relevante găsite în toate materialele.`)}if(b.dataset.practiceGenerate){const chapter=$('#practiceChapter')?.value||'Toate capitolele',type=$('#practiceType')?.value||'all',count=Number($('#practiceCount')?.value||10);let pool=quizzes.filter(q=>q.subject===subject).flatMap(q=>q.questions.map(it=>({...it,chapter:quizQuestionChapter(it,q),type:it.type||(isProblem(it)?'problem':'theory')}))).filter(it=>(chapter==='Toate capitolele'||it.chapter===chapter)&&(type==='all'||it.type===type));if(!pool.length)return msg('Nu există grile pentru aceste filtre.');pool=pool.sort(()=>Math.random()-.5).slice(0,count);quizSession={id:'generated',subject,title:'Exercițiu · '+chapter,chapter,questions:pool};render();msg(`Test generat: ${pool.length} întrebări.`)}});
 
 
// Quiz UX v3: editor visual, answer reveal per question, and precise chapter tagging.
let editingQuizId=null;
function preciseChapter(it,sub){
const txt=normalize([it.question,...(it.options||[])].join(' '));
const has=(words)=>words.some(w=>new RegExp('(^|\\s)'+normalize(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=\\s|$)','i').test(txt));
if(sub==='Chimie'){
 if(has(['alcool','alcoolul','alcooli','etanol','metanol','propanol','butanol','pentanol','hexanol','hidroxil','hidroxilica','alcoolului']))return 'Alcooli';
 if(has(['ester','esterificare','esteri','acetat']))return 'Esteri';
 if(has(['alchena','alchene','etena','propena']))return 'Alchene';
 if(has(['alchina','alchine','etina','acetilena']))return 'Alchine';
 if(has(['benzen','arene','toluen','aromatic']))return 'Arene';
 if(has(['alcan','alcani','metan','etan','propan','butan','pentan','hexan','decan']))return 'Alcani';
}
return chapterOf(txt,sub);
}
function answerIndices(it){
return [...new Set((Array.isArray(it.answer)?it.answer:[]).map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<(it.options||[]).length))].sort((a,b)=>a-b);
}
function quizChapterFor(it,q){return it.chapterOverride||it.chapterEdited||preciseChapter(it,q.subject||subject)}
function quizEditUI(){
const q=quizzes.find(x=>x.id===editingQuizId);if(!q)return '';
return `<section class="panel" id="quiz-editor"><h3>Editează testul: ${esc(q.title)}</h3>
<p class="muted">Modificările se salvează doar când apeși „Salvează”. Poți corecta capitolul, întrebarea, variantele și baremul oricând.</p>
<label>Titlu</label><input id="qe-title" value="${esc(q.title)}">
${q.questions.map((it,i)=>`<details class="result" ${i===0?'open':''}><summary><b>${i+1}. ${esc((it.question||'').slice(0,90))}</b> <span class="tag">${esc(quizChapterFor(it,q))}</span></summary>
<label>Capitolul acestei grile</label><input data-qe-chapter="${i}" value="${esc(it.chapterOverride||it.chapterEdited||quizChapterFor(it,q))}">
<label>Enunț</label><textarea data-qe-question="${i}">${esc(it.question||'')}</textarea>
${(it.options||[]).map((opt,j)=>`<label>Varianta ${'ABCDEF'[j]||j+1}</label><textarea data-qe-option="${i}:${j}" style="min-height:65px">${esc(opt)}</textarea>`).join('')}
<label>Răspuns corect (ex.: B sau A,C; gol dacă nu e cunoscut)</label><input data-qe-answer="${i}" value="${esc(answerIndices(it).map(n=>'ABCDEF'[n]).join(','))}">
<label>Tipul grilei</label><select data-qe-kind="${i}"><option value="auto">Detectare automată</option><option value="single" ${(it.answerMode==='single')?'selected':''}>Răspuns unic</option><option value="multiple" ${(it.answerMode==='multiple')?'selected':''}>Răspuns multiplu</option></select>
</details>`).join('')}
<button class="primary" data-quiz="saveVisualEdit">Salvează modificările</button> <button class="secondary" data-quiz="cancelVisualEdit">Anulează</button></section>`;
}
const oldQuizView3=quizView;
quizView=function(){
let html=oldQuizView3();
// Old editor button exists in previous patch; keep it and add visual editor.
return html+quizEditUI();
};
renderQuizSession=function(){
const q=quizSession;
return `<section class="panel" id="quiz-session"><h3>${esc(q.title)} · ${esc(q.chapter||'Mai multe capitole')}</h3>
<p class="muted">Verifică răspunsul după fiecare întrebare. Baremul este afișat numai dacă a fost identificat sau introdus.</p>
${q.questions.map((it,i)=>{
const ans=answerIndices(it),mode=it.answerMode==='multiple'||ans.length>1?'multiple':it.answerMode==='single'||ans.length===1?'single':'unknown';
const inputType=mode==='single'?'radio':'checkbox';
return `<div class="result"><b>${i+1}. ${esc(it.question||'')}</b>
<p><span class="tag">${esc(mode==='single'?'Răspuns unic':mode==='multiple'?'Răspuns multiplu':'Tip necunoscut — permite selecție multiplă')}</span>
<span class="tag">${esc(quizChapterFor(it,{subject:q.subject||subject}))}</span></p>
${(it.options||[]).map((opt,j)=>`<label style="font-weight:400"><input type="${inputType}" name="quiz-answer-${i}" data-answer="${i}:${j}"> ${'ABCDEF'[j]||j+1}) ${esc(opt)}</label>`).join('')}
<button class="secondary" data-quiz="revealOne" data-i="${i}">Verifică răspunsul</button>
<div class="answer hidden" id="quiz-feedback-${i}"></div></div>`;
}).join('')}
<button class="primary" data-quiz="grade">Finalizează și salvează rezultatul</button></section>`;
};
const oldHandleQuiz3=handleQuiz;
handleQuiz=async function(action,b){
try{
 if(action==='import'){
  const fileEl=document.getElementById('quizfile'),titleEl=document.getElementById('quiztitle'),chapterEl=document.getElementById('quizchapter'),textEl=document.getElementById('quiztext');
  if(!fileEl||!titleEl)return msg('Revino la Teste grilă și încearcă din nou.');
  const file=fileEl.files[0],sub=subject,title=titleEl.value.trim()||file?.name||'Test grilă';
  try{
   let raw=textEl?.value||'';
   if(file){
    if(/\.pdf$/i.test(file.name)||file.type==='application/pdf'){
     const parts=[];await pdfPages(file,async(p,total)=>{parts.push(p.text);msg(`Citesc PDF: ${p.number}/${total}`)});
     raw=parts.join('\n');
    }else raw=await file.text();
   }
   const questions=parseQuiz(raw);
   if(!questions.length)throw Error('Nu am găsit întrebări complete cu variante. Verifică formatul PDF.');
   // Read common answer-key formats, only from a clearly labeled key section.
   const keyStart=raw.search(/(?:^|\n)\s*(?:BAREM(?:UL)?(?:\s+DE\s+(?:CORECTARE|RĂSPUNSURI|RASPUNSURI))?|RĂSPUNSURI\s+CORECTE|RASPUNSURI\s+CORECTE|ANSWER\s+KEY)\s*[:\n]/im);
   if(keyStart>=0){
    const key=raw.slice(keyStart);
    const matches=[...key.matchAll(/(?:^|[\s;,])(\d{1,4})\s*[.):=\-]\s*([A-F](?:\s*[,;+]\s*[A-F])*)\b/gim)];
    for(const m of matches){
     const index=Number(m[1])-1;
     if(index<0||index>=questions.length)continue;
     const ans=[...new Set((m[2].match(/[A-F]/gi)||[]).map(x=>x.toUpperCase().charCodeAt(0)-65))].filter(n=>n<questions[index].options.length);
     if(ans.length)questions[index].answer=ans;
    }
   }
   for(const it of questions){it.chapter=preciseChapter(it,sub);it.type=isProblem(it)?'problem':'theory'}
   const chapter=chapterEl?.value.trim()||'Mai multe capitole';
   await put('quizzes',{id:uid(),subject:sub,title,chapter,questions,created:Date.now()});
   await reload();
   msg(`Importate ${questions.length} grile; ${questions.filter(q=>answerIndices(q).length).length} cu barem detectat. Poți edita ulterior.`);
  }catch(e){msg('Import test: '+e.message)}
  return;
 }
 if(action==='edit'){
  editingQuizId=b.dataset.id;quizSession=null;render();
  document.getElementById('quiz-editor')?.scrollIntoView({block:'start',behavior:'smooth'});return;
 }
 if(action==='cancelVisualEdit'){editingQuizId=null;render();return}
 if(action==='saveVisualEdit'){
  const q=quizzes.find(x=>x.id===editingQuizId);if(!q)throw Error('Testul nu a fost găsit.');
  const newQuestions=q.questions.map((it,i)=>{
   const question=document.querySelector(`[data-qe-question="${i}"]`)?.value.trim();
   const options=(it.options||[]).map((_,j)=>document.querySelector(`[data-qe-option="${i}:${j}"]`)?.value.trim()||'');
   const letters=(document.querySelector(`[data-qe-answer="${i}"]`)?.value||'').toUpperCase().match(/[A-F]/g)||[];
   const answer=[...new Set(letters.map(x=>x.charCodeAt(0)-65))].filter(n=>n<options.length).sort((a,b)=>a-b);
   const chapterOverride=document.querySelector(`[data-qe-chapter="${i}"]`)?.value.trim()||'Neclasificat';
   const answerMode=document.querySelector(`[data-qe-kind="${i}"]`)?.value||'auto';
   if(!question||options.filter(Boolean).length<2)throw Error(`Grila ${i+1}: completează enunțul și cel puțin două variante.`);
   return {...it,question,options,answer,chapterOverride,answerMode};
  });
  await put('quizzes',{...q,title:document.querySelector('#qe-title')?.value.trim()||q.title,questions:newQuestions});
  editingQuizId=null;await reload();msg('Modificările grilelor și capitolelor au fost salvate.');return;
 }
 if(action==='revealOne'){
  if(!quizSession)return;
  const i=Number(b.dataset.i),it=quizSession.questions[i],ans=answerIndices(it);
  const selected=[...document.querySelectorAll(`[data-answer^="${i}:"]:checked`)].map(el=>Number(el.dataset.answer.split(':')[1])).sort((a,b)=>a-b);
  const box=document.getElementById('quiz-feedback-'+i);if(!box)return;
  box.classList.remove('hidden');
  if(!ans.length){box.textContent='Baremul nu a fost identificat în acest PDF. Poți completa răspunsul corect din Editează testul.';return}
  const correct=selected.length===ans.length&&selected.every((n,j)=>n===ans[j]);
  box.innerHTML=`<b>${correct?'✓ Corect':'× Incorect'}</b><p>Răspuns corect: ${esc(ans.map(n=>'ABCDEF'[n]).join(', '))}</p><p>${ans.map(n=>esc(it.options[n]||'')).join(' · ')}</p>`;
  return;
 }
 if(action==='grade'){
  if(!quizSession)return;
  const q=quizSession;let correct=0,graded=0;
  for(let i=0;i<q.questions.length;i++){
   const it=q.questions[i],ans=answerIndices(it);if(!ans.length)continue;
   graded++;const selected=[...document.querySelectorAll(`[data-answer^="${i}:"]:checked`)].map(el=>Number(el.dataset.answer.split(':')[1])).sort((a,b)=>a-b);
   if(selected.length===ans.length&&selected.every((n,j)=>n===ans[j]))correct++;
  }
  if(!graded)return msg('Nu există barem identificat pentru acest test. Poți exersa, dar nu se poate calcula un scor corect.');
  await put('quizAttempts',{id:uid(),subject,title:q.title,chapter:q.chapter||'Mai multe capitole',quizId:q.id,correct,total:graded,date:Date.now()});
  quizSession=null;await reload();msg(`Rezultat: ${correct}/${graded} grile cu barem. ${q.questions.length-graded} fără barem, neincluse în scor.`);return;
 }
 if(action==='start'){
  const q=quizzes.find(x=>x.id===b.dataset.id);if(!q)return;
  quizSession=q;editingQuizId=null;render();return;
 }
 return oldHandleQuiz3(action,b);
}catch(e){msg('Teste: '+e.message);console.error(e)}
};
// Improve chapter assignment of existing imports at runtime without rewriting user edits.
const oldQuestionChapter=quizQuestionChapter;
quizQuestionChapter=function(it,q){return quizChapterFor(it,q)};
 
ready.then(async()=>{try{await reload()}catch(e){console.error('Eroare încărcare:',e);$('#status').textContent='Eroare la încărcarea datelor: '+e.message;render()}}).catch(e=>{$('#app').innerHTML='<p class="danger">Browserul nu permite stocarea locală: '+esc(e.message)+'</p>'});
</script></body></html>
